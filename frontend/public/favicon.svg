<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- Bridge icon representing connection -->
  <path d="M 20 60 Q 50 40, 80 60" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 20 65 Q 50 45, 80 65" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Letters TB -->
  <text x="50" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">TB</text>
</svg>
